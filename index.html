<!doctype html>
<html lang="en"><head>

<meta name="theme-color" content="#fffaf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<header class="bar">
  <a href="#/" class="logo" aria-label="Lumi home">
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs>

    <span class="wordmark">lumi</span></a>

</header>
<main id="app"></main>
<nav class="tabbar" aria-label="Main">
