<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumi — food scanner</title>
<meta name="description" content="Scan or search packaged foods and get a transparent, carb-first score.">
<meta name="theme-color" content="#fffaf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lumi">
<meta property="og:title" content="Lumi — food scanner"><meta property="og:description" content="Carb-first food scores from Open Food Facts + USDA."><meta property="og:image" content="icons/icon-512.png">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('lumi.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head><body>
<header class="bar">
  <a href="#/" class="logo" aria-label="Lumi home">
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs>
    <circle cx="20" cy="20" r="15" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="70.7 100" transform="rotate(135 20 20)"/><circle cx="20" cy="20" r="5" fill="url(#lg)"/></svg>
    <span class="wordmark">lumi</span></a>
  <nav><a href="#/saved" aria-label="Saved">♡</a><a href="#/about" aria-label="About">ⓘ</a><button id="theme" class="icon" aria-label="Toggle theme">◐</button></nav>
</header>
<main id="app"></main>
<button id="fab" class="fab" aria-label="Scan a barcode"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg><span>Scan</span></button>
<div id="scanner" class="scanner" hidden><div class="scan-top"><span>Point at a barcode</span><button id="scanClose" class="icon light" aria-label="Close">✕</button></div><div id="reader"></div><div class="scan-hint">EAN-13 · UPC-A · EAN-8 · UPC-E</div></div>
<div id="toast" class="toast" role="status"></div>
<script src="js/score.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body></html>
